<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1650" viewBox="0 0 1320 1650">
  <defs><style>.bg{fill:#f7f8f5}.frame{fill:#fff;stroke:#23343a;stroke-width:3}.line{stroke:#718188;stroke-width:2;fill:none}.soft{fill:#e8efeb;stroke:#718188;stroke-width:2}.ink{fill:#20343a;font-family:Arial,sans-serif}.title{font-size:23px;font-weight:700}.screen{font-size:18px;font-weight:700}.body{font-size:14px}.small{font-size:12px;fill:#65767b}.button{fill:#5069d8}.danger{fill:#c94b4b}.white{fill:#fff;font-family:Arial,sans-serif;font-size:14px;font-weight:700}.pill{fill:#eef1ff;stroke:#7385db;stroke-width:1.5}.dash{stroke:#718188;stroke-width:2;stroke-dasharray:7 6;fill:none}</style></defs>
  <rect width="1320" height="1650" class="bg"/>
  <text x="50" y="42" class="ink title">HealthMitra - six Figma-importable wireframes</text><text x="50" y="65" class="ink small">Low-fidelity board: patient-friendly, high-contrast, minimal typing</text>

  <!-- Screen 1: sign in -->
  <text x="50" y="105" class="ink screen">1. Sign in / choose role</text>
  <g transform="translate(50 125)"><rect width="360" height="650" rx="28" class="frame"/><text x="32" y="55" class="ink title">✚ HealthMitra</text><text x="32" y="88" class="ink small">Health support, close to home.</text><rect x="32" y="125" width="296" height="46" rx="10" class="soft"/><text x="48" y="153" class="ink body">Email address</text><rect x="32" y="190" width="296" height="46" rx="10" class="soft"/><text x="48" y="218" class="ink body">Password</text><rect x="32" y="260" width="296" height="48" rx="10" class="button"/><text x="152" y="290" class="white">Sign in</text><line x1="32" y1="345" x2="328" y2="345" class="line"/><text x="32" y="380" class="ink screen">Try the demo</text><rect x="32" y="400" width="140" height="44" rx="22" class="pill"/><text x="56" y="427" class="ink body">Patient: Meera</text><rect x="188" y="400" width="140" height="44" rx="22" class="pill"/><text x="204" y="427" class="ink body">Caregiver: Arjun</text><text x="32" y="495" class="ink body">New to HealthMitra? Create account</text><rect x="32" y="540" width="296" height="62" rx="12" class="soft"/><text x="48" y="566" class="ink body">Private, family-only health updates</text><text x="48" y="588" class="ink small">English / हिन्दी · Voice-friendly</text></g>

  <!-- Screen 2: Patient today -->
  <text x="460" y="105" class="ink screen">2. Patient - today's medicines</text>
  <g transform="translate(460 125)"><rect width="360" height="650" rx="28" class="frame"/><text x="28" y="44" class="ink small">THURSDAY, 31 JULY</text><text x="28" y="75" class="ink title">Good morning, Meera ✦</text><rect x="28" y="104" width="304" height="106" rx="14" class="soft"/><text x="45" y="135" class="ink small">YOU ARE DOING GREAT</text><text x="45" y="164" class="ink screen">2 of 4 doses complete</text><rect x="45" y="180" width="240" height="8" rx="4" fill="#c9ddd2"/><rect x="45" y="180" width="120" height="8" rx="4" fill="#43a477"/><text x="28" y="248" class="ink screen">Today's medicines</text><text x="28" y="270" class="ink small">Tap a medicine after you take it.</text><rect x="28" y="292" width="304" height="100" rx="12" class="soft"/><rect x="44" y="313" width="9" height="52" rx="4" fill="#5069d8"/><text x="68" y="322" class="ink small">8:00 AM</text><text x="68" y="347" class="ink screen">Metformin</text><text x="68" y="368" class="ink small">500 mg</text><rect x="224" y="315" width="88" height="32" rx="8" class="button"/><text x="242" y="336" class="white">✓ Taken</text><rect x="224" y="354" width="88" height="24" rx="8" fill="#fff" stroke="#718188"/><text x="248" y="371" class="ink small">Say it</text><rect x="28" y="410" width="304" height="100" rx="12" class="soft"/><rect x="44" y="431" width="9" height="52" rx="4" fill="#e77b47"/><text x="68" y="440" class="ink small">9:00 AM</text><text x="68" y="465" class="ink screen">Amlodipine</text><text x="68" y="486" class="ink small">5 mg</text><rect x="224" y="442" width="88" height="32" rx="8" class="button"/><text x="242" y="463" class="white">✓ Taken</text><rect x="28" y="545" width="304" height="54" rx="12" fill="#fff0ef" stroke="#d7786d" stroke-width="2"/><text x="48" y="577" class="ink screen">⚠ Emergency SOS</text></g>

  <!-- Screen 3: SOS -->
  <text x="870" y="105" class="ink screen">3. Patient - SOS confirmation</text>
  <g transform="translate(870 125)"><rect width="360" height="650" rx="28" class="frame"/><rect x="20" y="20" width="320" height="610" rx="18" fill="#ffffff"/><text x="310" y="58" class="ink title">×</text><circle cx="180" cy="190" r="62" fill="#fff0ef" stroke="#d7786d" stroke-width="3"/><text x="155" y="207" class="ink title" fill="#c94b4b">⚠</text><text x="75" y="294" class="ink title">Request emergency help?</text><text x="50" y="330" class="ink body">We will alert your connected caregivers</text><text x="66" y="352" class="ink body">and share your location if available.</text><rect x="40" y="405" width="280" height="58" rx="12" class="danger"/><text x="108" y="440" class="white">Send emergency SOS</text><text x="150" y="505" class="ink body">Cancel</text><rect x="40" y="550" width="280" height="44" rx="10" class="soft"/><text x="58" y="577" class="ink small">Caregivers: Arjun, Kavya</text></g>

  <!-- Screen 4: symptoms -->
  <text x="50" y="835" class="ink screen">4. Patient - symptom safety checker</text>
  <g transform="translate(50 855)"><rect width="360" height="650" rx="28" class="frame"/><text x="28" y="49" class="ink small">PATIENT TOOL</text><text x="28" y="80" class="ink title">How are you feeling?</text><text x="28" y="106" class="ink small">For minor common symptoms only.</text><text x="28" y="155" class="ink screen">Select a symptom</text><rect x="28" y="178" width="110" height="38" rx="19" class="pill"/><text x="49" y="202" class="ink body">Headache</text><rect x="148" y="178" width="105" height="38" rx="19" class="pill"/><text x="170" y="202" class="ink body">Mild fever</text><rect x="28" y="228" width="112" height="38" rx="19" class="pill"/><text x="48" y="252" class="ink body">Common cold</text><rect x="150" y="228" width="126" height="38" rx="19" class="pill"/><text x="168" y="252" class="ink body">Body ache</text><rect x="28" y="278" width="100" height="38" rx="19" class="pill"/><text x="49" y="302" class="ink body">Mild cough</text><rect x="244" y="137" width="88" height="34" rx="8" fill="#fff" stroke="#7385db" stroke-width="2"/><text x="267" y="159" class="ink small">◉ Speak</text><rect x="28" y="355" width="16" height="16" fill="#fff" stroke="#20343a" stroke-width="2"/><text x="55" y="369" class="ink body">Severe, sudden, or worsening symptoms</text><rect x="28" y="410" width="190" height="48" rx="10" class="button"/><text x="65" y="440" class="white">See safe guidance</text><rect x="28" y="492" width="304" height="104" rx="12" fill="#fff8e4" stroke="#e3b95a" stroke-width="2"/><text x="45" y="522" class="ink screen">Safety first</text><text x="45" y="549" class="ink body">Not medical advice. Consult a doctor</text><text x="45" y="570" class="ink body">if symptoms persist or worsen.</text></g>

  <!-- Screen 5: caregiver dashboard -->
  <text x="460" y="835" class="ink screen">5. Caregiver - adherence dashboard</text>
  <g transform="translate(460 855)"><rect width="360" height="650" rx="28" class="frame"/><text x="28" y="45" class="ink small">CAREGIVER VIEW</text><text x="28" y="75" class="ink title">Good morning, Arjun</text><rect x="28" y="103" width="304" height="76" rx="12" class="soft"/><circle cx="62" cy="141" r="20" fill="#dfc6a6"/><text x="54" y="147" class="ink body">M</text><text x="95" y="133" class="ink small">YOUR LOVED ONE</text><text x="95" y="158" class="ink screen">Meera Shah</text><text x="243" y="152" class="ink small">🔥 3 days</text><rect x="28" y="198" width="92" height="72" rx="11" class="soft"/><text x="39" y="224" class="ink small">ADHERENCE</text><text x="47" y="254" class="ink title">75%</text><rect x="134" y="198" width="92" height="72" rx="11" class="soft"/><text x="145" y="224" class="ink small">TAKEN</text><text x="156" y="254" class="ink title">3/4</text><rect x="240" y="198" width="92" height="72" rx="11" class="soft"/><text x="251" y="224" class="ink small">ALERTS</text><text x="268" y="254" class="ink title">1</text><text x="28" y="318" class="ink screen">Weekly adherence</text><line x1="45" y1="472" x2="315" y2="472" class="line"/><rect x="58" y="408" width="24" height="64" fill="#97b7aa"/><rect x="96" y="382" width="24" height="90" fill="#97b7aa"/><rect x="134" y="430" width="24" height="42" fill="#97b7aa"/><rect x="172" y="395" width="24" height="77" fill="#97b7aa"/><rect x="210" y="370" width="24" height="102" fill="#97b7aa"/><rect x="248" y="405" width="24" height="67" fill="#97b7aa"/><rect x="286" y="360" width="24" height="112" fill="#5069d8"/><text x="28" y="520" class="ink screen">Today's schedule</text><rect x="28" y="540" width="304" height="46" rx="10" class="soft"/><circle cx="49" cy="563" r="5" fill="#43a477"/><text x="65" y="568" class="ink body">Metformin · 8:00 AM · Taken</text><rect x="28" y="595" width="304" height="46" rx="10" class="soft"/><circle cx="49" cy="618" r="5" fill="#c94b4b"/><text x="65" y="623" class="ink body">Amlodipine · 9:00 AM · Missed</text></g>

  <!-- Screen 6: alerts -->
  <text x="870" y="835" class="ink screen">6. Caregiver - alerts and SOS follow-up</text>
  <g transform="translate(870 855)"><rect width="360" height="650" rx="28" class="frame"/><text x="28" y="46" class="ink small">CAREGIVER VIEW</text><text x="28" y="78" class="ink title">Care updates</text><text x="28" y="102" class="ink small">Medication and emergency events</text><rect x="28" y="130" width="304" height="105" rx="12" fill="#fff1ef" stroke="#d7786d" stroke-width="2"/><text x="47" y="163" class="ink screen">! Missed dose</text><text x="47" y="189" class="ink body">Meera missed Amlodipine (5 mg).</text><text x="47" y="213" class="ink small">Today · 9:15 AM</text><text x="250" y="213" class="ink small">Mark read</text><rect x="28" y="250" width="304" height="105" rx="12" fill="#fff" stroke="#718188" stroke-width="2"/><text x="47" y="283" class="ink screen">⚠ Emergency SOS</text><text x="47" y="309" class="ink body">Meera triggered an SOS. Location shared.</text><text x="47" y="333" class="ink small">Today · 10:02 AM</text><text x="257" y="333" class="ink small">Mark read</text><text x="28" y="405" class="ink screen">SOS history</text><rect x="28" y="428" width="304" height="132" rx="12" class="soft"/><circle cx="55" cy="466" r="18" fill="#fff0ef" stroke="#d7786d" stroke-width="2"/><text x="49" y="472" class="ink body">⚠</text><text x="86" y="460" class="ink screen">Emergency SOS</text><text x="86" y="484" class="ink small">Today · 10:02 AM · Location shared</text><text x="86" y="507" class="ink small">Open map</text><rect x="86" y="522" width="92" height="26" rx="7" fill="#fff" stroke="#718188"/><text x="99" y="540" class="ink small">Acknowledge</text><rect x="188" y="522" width="67" height="26" rx="7" class="button"/><text x="202" y="540" class="white" font-size="11">Resolve</text><line x1="28" y1="595" x2="332" y2="595" class="dash"/><text x="28" y="623" class="ink small">All critical alerts have clear action and status.</text></g>
</svg>
