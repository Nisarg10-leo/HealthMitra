services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: healthmitra
      POSTGRES_USER: healthmitra
      POSTGRES_PASSWORD: healthmitra
      TZ: Asia/Kolkata
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthmitra -d healthmitra"]
      interval: 5s
      timeout: 3s
      retries: 10
  server:
    build: ./server
    environment:
      PORT: 4000
      TZ: Asia/Kolkata
      APP_TIMEZONE: Asia/Kolkata
      REMINDER_WINDOW_MINUTES: 15
      DATABASE_URL: postgresql://healthmitra:healthmitra@database:5432/healthmitra
      CLIENT_ORIGIN: http://localhost:5173
    ports: ["4000:4000"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  client:
    build: ./client
    ports: ["5173:80"]
    depends_on:
      server:
        condition: service_healthy
volumes:
  postgres_data:
