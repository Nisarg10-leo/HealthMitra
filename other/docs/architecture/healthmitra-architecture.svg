<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><style>.t{font-family:Arial,sans-serif;fill:#20343a}.h{font-size:20px;font-weight:700}.b{font-size:14px}.s{font-size:12px;fill:#65767b}.box{stroke-width:2}.arrow{fill:none;stroke:#5269d8;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#c16c61;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrowRed)}.green{stroke:#438b68}.cyan{stroke:#529fb4}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5269d8"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c16c61"/></marker></defs>
  <rect width="1600" height="900" fill="#fafbf9"/>
  <text x="60" y="64" class="t h" font-size="28">HealthMitra - Local to Production Architecture</text><text x="60" y="94" class="t s" font-size="15">Voice-friendly medication adherence and family caregiver support</text>
  <g><rect x="65" y="270" width="180" height="115" rx="16" fill="#fff7e6" stroke="#e3b95a" class="box"/><text x="85" y="300" class="t h">Users</text><text x="85" y="326" class="t b">Patient (elderly)</text><text x="85" y="350" class="t b">Caregiver (family)</text></g>
  <g><rect x="330" y="220" width="265" height="175" rx="16" fill="#eef1ff" stroke="#7385db" class="box"/><text x="350" y="252" class="t h">Frontend</text><text x="350" y="280" class="t b">React + Vite</text><text x="350" y="305" class="t b">i18next: English / Hindi</text><text x="350" y="330" class="t b">Accessible large controls</text><text x="350" y="355" class="t b">Speech + geolocation</text></g>
  <g><rect x="710" y="205" width="285" height="190" rx="16" fill="#e9f5ef" stroke="#53a77c" class="box"/><text x="730" y="237" class="t h">Backend API</text><text x="730" y="265" class="t b">Node.js + Express REST</text><text x="730" y="290" class="t b">Role-aware access checks</text><text x="730" y="315" class="t b">Medication CRUD, SOS, contacts</text><text x="730" y="340" class="t b">Voice intent integration seam</text></g>
  <g><rect x="1060" y="205" width="260" height="190" rx="16" fill="#f2f2f2" stroke="#7d8a8e" class="box"/><text x="1080" y="237" class="t h">Data / Cache</text><text x="1080" y="265" class="t b">PostgreSQL 16</text><text x="1080" y="290" class="t b">users, links, medications</text><text x="1080" y="315" class="t b">dose_logs, sos_events</text><text x="1080" y="340" class="t b">contacts, notifications</text></g>
  <g><rect x="710" y="465" width="210" height="130" rx="16" fill="#f2f7f4" stroke="#73a88a" class="box"/><text x="730" y="497" class="t h">Scheduler</text><text x="730" y="523" class="t b">node-cron every minute</text><text x="730" y="548" class="t b">Reminder + missed checks</text></g>
  <g><rect x="1060" y="465" width="240" height="130" rx="16" fill="#fff1ef" stroke="#d7786d" class="box"/><text x="1080" y="497" class="t h">Notifications</text><text x="1080" y="523" class="t b">In-app log / FCM seam</text><text x="1080" y="548" class="t b">Missed dose + SOS alerts</text></g>
  <g><rect x="330" y="620" width="300" height="130" rx="16" fill="#e8f5f8" stroke="#529fb4" class="box"/><text x="350" y="652" class="t h">Containerization</text><text x="350" y="678" class="t b">Dockerfiles: client + API</text><text x="350" y="703" class="t b">Compose: client + API + Postgres</text><text x="350" y="728" class="t b">Health checks / env config</text></g>
  <g><rect x="830" y="620" width="330" height="130" rx="16" fill="#f3effa" stroke="#9276c7" class="box"/><text x="850" y="652" class="t h">Deployment / Infrastructure</text><text x="850" y="678" class="t b">Frontend: Vercel / Netlify</text><text x="850" y="703" class="t b">API + DB: Railway / Render</text><text x="850" y="728" class="t b">Secrets: DB URL, FCM, Groq</text></g>
  <g><rect x="1230" y="655" width="280" height="115" rx="16" fill="#fff" stroke="#cbd6d2" class="box"/><text x="1250" y="686" class="t h">Legend</text><text x="1250" y="712" class="t b">Solid: request/data flow</text><text x="1250" y="735" class="t b">Dashed: event/notification flow</text><text x="1250" y="756" class="t b">External services are replaceable</text></g>
  <path d="M245 327H330" class="arrow"/><text x="258" y="310" class="t s">HTTPS + UI events</text><path d="M595 305H710" class="arrow"/><text x="620" y="287" class="t s">REST / JSON</text><path d="M995 300H1060" class="arrow green"/><text x="1000" y="282" class="t s">read / write</text><path d="M815 465V395" class="arrow green"/><text x="825" y="435" class="t s">scheduled logs</text><path d="M920 530H1060" class="dash"/><text x="935" y="512" class="t s">reminder / missed event</text><path d="M1180 465V150H465V220" class="dash"/><text x="760" y="142" class="t s">push / SMS adapter</text><path d="M630 685H830" class="arrow cyan"/><text x="685" y="667" class="t s">build / run</text><path d="M1100 620V395" class="arrow cyan"/><text x="1110" y="540" class="t s">deploy services</text>
</svg>
