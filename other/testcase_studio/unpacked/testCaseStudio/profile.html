<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TestCaseStudio Profile</title>
    <link rel="stylesheet" type="text/css" href="profile-light.css" type="text/css" media="screen"
    />
    <meta name="theme-color" content="#5fba7d" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
<body>

<!-- Logout Modal Start -->
<div class="logout_modal_container">
  <div class="logout_modal">
    <p class="modal_description">Are you sure you want to logout?</p>
    <div class="modal_btns">
      <button class="modal_btn confirm">Logout</button>
      <button class="modal_btn cancel">Cancel</button>
    </div>
  </div>
</div>
<!-- Logout Modal End -->

  <div class="cancle_modal_container">
      <div class="cancle_modal">
        <p class="modal_description">Are you sure you want to Cancel?</p>
        <div class="modal_btns">
            <button class="modal_btn btn btn-danger confirm-cancle">Yes</button>
            <button class="modal_btn cancel">Cancel</button>
        </div>
      </div>
  </div>

<ul class="navheader">
  <li><a href="#" class="open-profile  h-links active">Profile</a></li>
  <li><a href="#" class="open-logout h-links">Logout</a></li>

</ul>

  <div class="loading-view">
    <div class="loader"></div>      
  </div>


<div class="profile-section section-one ">
  <p class="plan-label">Your plan</p>
  <h3 class="renewsub"></h3>
  <button id="cancle-plan" class="btn btn-danger mb-1">Cancel Plan</button>

  <!-- v3.0.4: one upgrade path only. The $10 ads-blocker plans are no longer offered here. -->
  <div class="pro-card">
    <span class="pro-card__tag">TestCase Studio Pro</span>
    <p class="pro-card__title">Unlimited steps, integrations and no ads, for good.</p>
    <p class="pro-card__sub">Jira, Azure DevOps &amp; TestRail export · BDD support · Priority support</p>
    <a class="pro-card__btn" href="https://selectorshub.com/testcase-studio-pro/plans/" target="_blank" rel="noopener">Get TestCase Studio Pro &rarr;</a>
  </div>
</div>


</body>
   <script src="jquery.js"></script>
   <script src="profile.js"></script>
</html>
